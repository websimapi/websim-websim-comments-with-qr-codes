<html><head><base href ".");
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WebSim Comments with QR Codes</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 20px;
      line-height: 1.5;
    }

    .comments {
      max-width: 800px;
      margin: 0 auto;
    }

    .comment {
      border: 1px solid #ddd;
      padding: 15px;
      margin-bottom: 15px;
      border-radius: 8px;
    }

    .comment-header {
      display: flex;
      align-items: center;
      margin-bottom: 10px;
    }

    .comment-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      margin-right: 10px;
    }

    .comment-username {
      font-weight: bold;
    }

    .qr-codes {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    .qr-code {
      text-align: center;
      cursor: pointer;
      transition: transform 0.2s;
    }

    .qr-code:hover {
      transform: scale(1.05);
    }

    .qr-code canvas {
      margin-bottom: 5px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    #iframe-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: white;
      z-index: 1000;
    }

    #frame-content {
      width: 100%;
      height: 100%;
      border: none;
    }

    #close-frame {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 1001;
      padding: 8px 16px;
      background: #333;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: bold;
      transition: background 0.2s;
    }

    #close-frame:hover {
      background: #555;
    }

    #qr-display {
      position: fixed;
      top: 10px;
      right: 10px;
      z-index: 1001;
      width: 100px;
      height: 100px;
      background: white;
      padding: 5px;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .load-more {
      display: block;
      width: 100%;
      padding: 10px;
      background: #f0f0f0;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 20px;
      transition: background 0.2s;
    }

    .load-more:hover {
      background: #e0e0e0;
    }

    .timestamp {
      color: #666;
      font-size: 0.8em;
      margin-left: 10px;
    }
  </style>
</head>
<body>
  <div class="comments">
    <div id="comments-list"></div>
    <button id="load-more" class="load-more">Load More Comments</button>
  </div>

  <div id="iframe-overlay">
    <button id="close-frame">Close</button>
    <div id="qr-display"></div>
    <iframe id="frame-content"></iframe>
  </div>

  <script>
    // Extract websim.ai URLs from text
    function extractUrls(text) {
      const websimUrlRegex = /(https?:\/\/(?:www\.|api\.|party\.)?websim\.ai[^\s<>[\]{}|\\^]+)/gi;
      return text.match(websimUrlRegex) || [];
    }

    // Create QR code element
    function createQrCode(url) {
      const container = document.createElement('div');
      container.className = 'qr-code';
      
      const qrElement = document.createElement('div');
      new QRCode(qrElement, {
        text: url,
        width: 128,
        height: 128,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
      
      container.appendChild(qrElement);
      container.addEventListener('click', () => openFrame(url));
      
      return container;
    }

    // Open iframe overlay
    function openFrame(url) {
      const overlay = document.getElementById('iframe-overlay');
      const frame = document.getElementById('frame-content');
      const qrDisplay = document.getElementById('qr-display');
      
      qrDisplay.innerHTML = '';
      new QRCode(qrDisplay, {
        text: url,
        width: 100,
        height: 100,
        colorDark: "#000000",
        colorLight: "#ffffff",
        correctLevel: QRCode.CorrectLevel.H
      });
      
      frame.src = url;
      overlay.style.display = 'block';
    }

    // Close iframe overlay
    document.getElementById('close-frame').addEventListener('click', () => {
      const overlay = document.getElementById('iframe-overlay');
      const frame = document.getElementById('frame-content');
      frame.src = '';
      overlay.style.display = 'none';
    });

    // Format timestamp
    function formatTimestamp(timestamp) {
      const date = new Date(timestamp);
      return date.toLocaleDateString() + ' ' + date.toLocaleTimeString();
    }

    // Process comment text and extract references
    function processCommentText(content) {
      if (!content) return '';
      
      if (content.children && content.children[0]) {
        if (content.children[0].children) {
          return content.children[0].children.map(child => {
            if (child.type === 'text') return child.text;
            if (child.type === 'link') return child.url;
            return '';
          }).join(' ');
        }
        if (content.children[0].text) {
          return content.children[0].text;
        }
      }
      return '';
    }

    // Create comment element
    function createCommentElement(comment) {
      const commentText = processCommentText(comment.content);
      const urls = extractUrls(commentText);
      
      // Only create comment element if there are valid websim.ai URLs
      if (urls.length === 0) {
        return null;
      }
      
      const container = document.createElement('div');
      container.className = 'comment';
      
      const header = document.createElement('div');
      header.className = 'comment-header';
      
      const avatar = document.createElement('img');
      avatar.className = 'comment-avatar';
      avatar.src = `https://images.websim.ai/avatar/${comment.author.username}`;
      avatar.alt = comment.author.username;
      
      const username = document.createElement('div');
      username.className = 'comment-username';
      username.textContent = '@' + comment.author.username;
      
      const timestamp = document.createElement('div');
      timestamp.className = 'timestamp';
      timestamp.textContent = formatTimestamp(comment.created_at);
      
      header.appendChild(avatar);
      header.appendChild(username);
      header.appendChild(timestamp);
      
      container.appendChild(header);

      const qrCodes = document.createElement('div');
      qrCodes.className = 'qr-codes';
      urls.forEach(url => {
        qrCodes.appendChild(createQrCode(url));
      });
      container.appendChild(qrCodes);
      
      return container;
    }

    let currentCursor = null;
    let hasMoreComments = true;

    async function getCurrentProject() {
      const project = await window.websim.getCurrentProject();
      return project.id;
    }

    async function loadComments(projectId, cursor = null) {
      const params = new URLSearchParams();
      if (cursor) params.set('after', cursor);
      params.set('first', '20');
      
      const response = await fetch(`/api/v1/projects/${projectId}/comments?${params}`);
      const data = await response.json();
      return data.comments;
    }

    async function init() {
      try {
        const projectId = await getCurrentProject();
        const commentsContainer = document.getElementById('comments-list');
        const loadMoreButton = document.getElementById('load-more');
        
        async function loadMoreComments() {
          if (!hasMoreComments) return;
          
          const comments = await loadComments(projectId, currentCursor);
          
          comments.data.forEach(({comment}) => {
            const commentElement = createCommentElement(comment);
            if (commentElement) {
              commentsContainer.appendChild(commentElement);
            }
          });
          
          hasMoreComments = comments.meta.has_next_page;
          currentCursor = comments.meta.end_cursor;
          
          loadMoreButton.style.display = hasMoreComments ? 'block' : 'none';
        }
        
        loadMoreButton.addEventListener('click', loadMoreComments);
        
        await loadMoreComments();
        
      } catch (error) {
        console.error('Error loading comments:', error);
      }
    }

    init();
  </script>

</body>
